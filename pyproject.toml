[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syssentry"
version = "1.0.0"
description = "Lightweight Linux server health monitor with alerting and auto-remediation"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "PyYAML>=6.0", "Flask>=3.0"]

[project.scripts]
syssentry = "syssentry.cli:main"

[tool.setuptools]
packages = ["syssentry"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
